apiVersion: 1
# Read-only role grafana_ro (SELECT on the four live/health tables only), created by warehouse/live_ddl.sql.
# Both values come from the grafana container environment (docker-compose.yml); no secret is stored here.
datasources:
  - name: FunnelStream Postgres
    uid: fs-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      timescaledb: false
      postgresVersion: 1600
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
