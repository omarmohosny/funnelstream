apiVersion: 1
# Spec 17.19. Six alert rules, evaluated every minute, notifying the webhook contact point fs-webhook
# (scripts/alert_sink.py listens on the host, port 9099, and prints/logs every alert).
#
# NOTE: history-mode data is late by rule (every event is older than the watermark), so rule (a) is meaningful for
# --live runs only. Rules (b) and (c) work in both modes.
#
# Four rules read the contract tables (pipeline_health_minute, pipeline_heartbeat); fs-oos-demand reads
# live_oos_demand_minute (only rows flagged oos_at_write, summed over campaigns per minute); fs-express-sla reads
# live_express_orders only (a breach is a delivery later than the order's own promise, or an open order older than its
# promise plus one minute of grace; a cancelled or returned order that was never delivered is not a breach). A query that returns no row
# means "not enough data": the rules with noDataState OK then report OK; fs-silver-silent and fs-no-events treat no
# data as firing.
#
# Why two stall rules: a Silver batch takes about 60 s on the demo laptop and the health table is written per batch, so
# the newest minute with events can be about 3 minutes old while the job is healthy. "No events" therefore looks at
# 5 minutes. "Silver job silent" looks at the heartbeat, which a separate thread writes every 15 s whatever the batch
# speed, so it is the fast alarm for a crashed job (about 2 to 3 minutes).
groups:
  - orgId: 1
    name: fs-pipeline
    folder: FunnelStream alerts
    interval: 1m
    rules:
      - uid: fs-late-rate
        title: Late-event rate above 5% (5 min)
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Late-event rate is above 5% over the last 5 minutes"
          runbook: "Check the simulator for a clock skew or a replay of old events, then check the Silver watermark; if the source is healthy, raise the watermark delay."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: fs-postgres
            model:
              refId: A
              datasource: {type: postgres, uid: fs-postgres}
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: >-
                SELECT now() AS time, 100.0 * sum(late_events) / sum(events) AS late_pct
                FROM pipeline_health_minute
                WHERE minute_start >= now() - interval '5 minutes'
                HAVING sum(events) >= 20
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [5]}
              datasource: {type: __expr__, uid: __expr__}
      - uid: fs-quarantine-share
        title: Quarantine share above 2% (5 min)
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "More than 2% of the rows received in the last 5 minutes went to silver_quarantine"
          runbook: "Group silver_quarantine by reason for the last 10 minutes; fix the producer (simulator or source) that sends the bad rows, then replay if needed."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: fs-postgres
            model:
              refId: A
              datasource: {type: postgres, uid: fs-postgres}
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: >-
                SELECT now() AS time, 100.0 * sum(quarantined) / (sum(events) + sum(quarantined)) AS quarantine_pct
                FROM pipeline_health_minute
                WHERE minute_start >= now() - interval '5 minutes'
                HAVING sum(events) + sum(quarantined) >= 20
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [2]}
              datasource: {type: __expr__, uid: __expr__}
      - uid: fs-silver-silent
        title: Silver job silent for 2 minutes
        condition: C
        for: 0s
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "The Silver job has not reported for 2 minutes"
          runbook: "The Silver job is down (a job that is alive but stuck on a batch is caught by 'No events for 5 minutes'): check docker compose ps and the fs-pipeline container logs; restart it with the same command and checkpoints (scripts/failure_demo.ps1 restart), then confirm the heartbeat age drops under 30 s."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: fs-postgres
            model:
              refId: A
              datasource: {type: postgres, uid: fs-postgres}
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: >-
                SELECT now() AS time, count(*) AS alive
                FROM pipeline_heartbeat
                WHERE component = 'silver_job' AND last_seen_at >= now() - interval '2 minutes'
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
              datasource: {type: __expr__, uid: __expr__}
      - uid: fs-no-events
        title: No events for 5 minutes
        condition: C
        for: 0s
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "No Silver events arrived in the last 5 minutes"
          runbook: "Check that the simulator and the Silver job are running (docker compose ps, the spark container logs); restart the Silver job, then confirm the event line recovers."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: fs-postgres
            model:
              refId: A
              datasource: {type: postgres, uid: fs-postgres}
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: >-
                SELECT now() AS time, coalesce(sum(events), 0) AS events_5m
                FROM pipeline_health_minute
                WHERE minute_start >= now() - interval '5 minutes'
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
              datasource: {type: __expr__, uid: __expr__}
      - uid: fs-oos-demand
        title: Demand on out-of-stock products
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "At least 5 add-to-carts a minute on an out-of-stock product, two minutes in a row"
          runbook: "Open the dashboard 'Operations, live inventory', table 'Lost demand now': restock the listed store and product, or ask marketing to pause the campaign that sends traffic to it."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: fs-postgres
            model:
              refId: A
              datasource: {type: postgres, uid: fs-postgres}
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: >-
                SELECT now() AS time, count(*) AS products
                FROM (
                  SELECT store_id, product_id
                  FROM (
                    SELECT minute_start, store_id, product_id, sum(add_to_cart) AS carts
                    FROM live_oos_demand_minute
                    WHERE minute_start >= now() - interval '3 minutes' AND oos_at_write
                    GROUP BY minute_start, store_id, product_id
                  ) m
                  WHERE carts >= 5
                  GROUP BY store_id, product_id
                  HAVING count(*) >= 2
                ) t
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
              datasource: {type: __expr__, uid: __expr__}
      - uid: fs-express-sla
        title: An express order missed its delivery promise
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "An express order missed its delivery promise"
          runbook: "Open 'Operations, live inventory', table 'Slowest express orders': find the store, check its stock and riders, call the customer, and record the cause."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: fs-postgres
            model:
              refId: A
              datasource: {type: postgres, uid: fs-postgres}
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: >-
                SELECT now() AS time, count(*) AS breaches
                FROM live_express_orders
                WHERE created_at >= now() - interval '60 minutes'
                  AND ((delivered_at IS NOT NULL AND delivered_at - created_at > promised_minutes * interval '1 minute')
                    OR (delivered_at IS NULL AND NOT closed_without_delivery
                        AND now() - created_at > promised_minutes * interval '1 minute' + interval '1 minute'))
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
              datasource: {type: __expr__, uid: __expr__}
contactPoints:
  - orgId: 1
    name: fs-webhook
    receivers:
      - uid: fs-webhook
        type: webhook
        settings:
          url: http://host.docker.internal:9099/alert
          httpMethod: POST
        disableResolveMessage: false
policies:
  - orgId: 1
    receiver: fs-webhook
    group_by: [alertname]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h
