name: funnelstream

services:
  kafka:
    image: apache/kafka:3.7.0
    mem_limit: 1g
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    restart: unless-stopped

  postgres:
    image: postgres:16
    mem_limit: 512m
    ports: ["5432:5432"]
    env_file: .env
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.9.2-python3.11
    profiles: ["airflow"]   # off by default (2 GB): docker compose --profile airflow up -d airflow
    mem_limit: 2g
    ports: ["8080:8080"]
    env_file: .env
    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: "databricks-sql-connector requests pyarrow pyspark==3.5.1 psycopg[binary]==3.1.19"
      AD_API_URL: "http://host.docker.internal:8000"
      PYTHONPATH: /opt/airflow
      PG_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./batch:/opt/airflow/batch
      - ./simulator:/opt/airflow/simulator
      - ./warehouse:/opt/airflow/warehouse
      - ./contracts:/opt/airflow/contracts
      - ./streaming:/opt/airflow/streaming
      - ./data:/opt/airflow/data
    command: standalone
    restart: unless-stopped

  spark:
    build: infrastructure/docker/spark
    profiles: ["spark"]
    mem_limit: 4g
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      SPARK_LOCAL_IP: 127.0.0.1
      PG_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"  # live and health tables; no depends_on, the job runs without Postgres
    volumes:
      - ./:/app
      - ivycache:/root/.ivy2

  grafana:
    image: grafana/grafana-oss:11.3.0
    mem_limit: 512m
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline-live.json
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
  ivycache:
  grafanadata:
