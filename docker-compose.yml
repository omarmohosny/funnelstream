name: funnelstream

services:
  kafka:
    image: apache/kafka:3.7.0
    mem_limit: 1g
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    restart: unless-stopped

  postgres:
    image: postgres:16
    mem_limit: 512m
    ports: ["5432:5432"]
    env_file: .env
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.9.2-python3.11
    mem_limit: 2g
    ports: ["8080:8080"]
    env_file: .env
    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: "databricks-sql-connector requests pyarrow"
      AD_API_URL: "http://host.docker.internal:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./batch:/opt/airflow/batch
      - ./simulator:/opt/airflow/simulator
      - ./warehouse:/opt/airflow/warehouse
      - ./contracts:/opt/airflow/contracts
      - ./data:/opt/airflow/data
    command: standalone
    restart: unless-stopped

volumes:
  pgdata:
